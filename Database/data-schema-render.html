<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; padding: 24px; background: #ffffff; }
    #wrap { width: 2400px; }
  </style>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "default" });
    const code = "erDiagram\r\n    CLIENTS {\r\n        INTEGER id PK\r\n        TEXT name\r\n        TEXT email UK\r\n        TEXT password_hash\r\n        INTEGER is_admin\r\n        TEXT created_at\r\n        TEXT address_line1\r\n        TEXT address_line2\r\n        TEXT county\r\n        TEXT postcode\r\n        TEXT phone\r\n    }\r\n\r\n    SESSIONS {\r\n        TEXT token PK\r\n        INTEGER client_id FK\r\n        TEXT expires_at\r\n    }\r\n\r\n    LOGIN_LINKS {\r\n        TEXT token PK\r\n        INTEGER client_id FK\r\n        TEXT expires_at\r\n        TEXT used_at\r\n    }\r\n\r\n    PHOTOS {\r\n        INTEGER id PK\r\n        INTEGER client_id FK\r\n        TEXT filename\r\n        TEXT mime_type\r\n        BLOB photo_data\r\n        TEXT description\r\n        TEXT created_at\r\n    }\r\n\r\n    QUOTES {\r\n        INTEGER id PK\r\n        INTEGER client_id FK\r\n        TEXT damage_type\r\n        TEXT severity\r\n        INTEGER panels\r\n        TEXT registration\r\n        TEXT postcode\r\n        TEXT contact_methods\r\n        TEXT other_details\r\n        TEXT admin_note\r\n        INTEGER estimate_low\r\n        INTEGER estimate_high\r\n        TEXT status\r\n        TEXT created_at\r\n    }\r\n\r\n    QUOTE_INTAKES {\r\n        INTEGER id PK\r\n        TEXT email\r\n        TEXT registration\r\n        TEXT postcode\r\n        TEXT name\r\n        TEXT address_line1\r\n        TEXT address_line2\r\n        TEXT county\r\n        TEXT phone\r\n        TEXT other_details\r\n        TEXT admin_note\r\n        TEXT reference UK\r\n        TEXT status\r\n        TEXT created_at\r\n    }\r\n\r\n    CLIENTS ||--o{ SESSIONS : has\r\n    CLIENTS ||--o{ LOGIN_LINKS : receives\r\n    CLIENTS ||--o{ PHOTOS : uploads\r\n    CLIENTS ||--o{ QUOTES : requests\r\n";
    const el = document.getElementById("diagram");
    const { svg } = await mermaid.render("dbSchema", code);
    el.innerHTML = svg;
  </script>
</head>
<body>
  <div id="wrap">
    <div id="diagram">Rendering...</div>
  </div>
</body>
</html>
